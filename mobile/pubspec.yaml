name: pawsnearby
description: "PETSTA is a pet marketplace: browse and reserve pets from licensed local shops, buy pet supplies, book services and vet video consults, and run your shop from one app."
# Private app: prevents an accidental `flutter pub publish`.
publish_to: 'none'

# version: <versionName>+<build number>. The build number is the Android
# versionCode and the iOS CFBundleVersion, and must increase on every store
# upload. Override per build with --build-name / --build-number
# (see docs/RELEASING.md).
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  go_router: ^17.5.0
  flutter_riverpod: ^3.3.2
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  fl_chart: ^0.69.2
  package_info_plus: ^10.2.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

# App icon: `dart run flutter_launcher_icons` (artwork is generated by
# assets/generate_brand_assets.py). iOS gets an opaque 1024 icon; Android gets
# an adaptive icon (gradient background + white paw foreground), an Android 13
# themed (monochrome) layer and a rounded legacy icon for Android 7.x.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  image_path_android: "assets/icon/icon_legacy.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

# Native launch screen: `dart run flutter_native_splash:create`. Brand indigo
# with the white paw; Android 12+ uses the system splash (android_12 block).
flutter_native_splash:
  color: "#4F46E5"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#4F46E5"
    image: assets/splash/splash_android12.png
  web: false
